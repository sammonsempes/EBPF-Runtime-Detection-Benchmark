apiVersion: v1
kind: Pod
metadata:
  name: bench-workload
  namespace: ebpf-bench
  labels:
    ebpf-bench.role: workload
spec:
  hostname: bench-workload
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 2
  restartPolicy: Never
  containers:
    - name: bench-workload
      image: ebpf-bench/victim:latest
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
