apiVersion: apps/v1
kind: Deployment
metadata:
  name: attacker
  namespace: ebpf-bench
  labels:
    ebpf-bench.role: attacker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attacker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attacker
        ebpf-bench.role: attacker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: attacker
          image: ebpf-bench/attacker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: shell
              containerPort: 4444
            - name: stratum
              containerPort: 3333
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: attacker
  namespace: ebpf-bench
  labels:
    ebpf-bench.role: attacker
spec:
  selector:
    app.kubernetes.io/name: attacker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: shell
      port: 4444
      targetPort: 4444
    - name: stratum
      port: 3333
      targetPort: 3333
