apiVersion: v1
kind: Pod
metadata:
  name: bench-victim
  namespace: ebpf-bench
  labels:
    ebpf-bench.role: victim
    kubearmor.io/container.name: bench-victim
spec:
  hostname: bench-victim
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 2
  restartPolicy: Never
  containers:
    - name: bench-victim
      image: ebpf-bench/victim:latest
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
