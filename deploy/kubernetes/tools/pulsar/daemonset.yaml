apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pulsar
  labels:
    app.kubernetes.io/name: pulsar
    ebpf-bench.role: tool
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsar
        ebpf-bench.role: tool
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      tolerations:
        - operator: Exists
      containers:
        - name: pulsar
          image: ghcr.io/exein-io/pulsar:v0.10.1
          imagePullPolicy: IfNotPresent
