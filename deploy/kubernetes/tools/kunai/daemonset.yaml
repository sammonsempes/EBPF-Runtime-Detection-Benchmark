apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kunai
  labels:
    app.kubernetes.io/name: kunai
    ebpf-bench.role: tool
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kunai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kunai
        ebpf-bench.role: tool
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      tolerations:
        - operator: Exists
      containers:
        - name: kunai
          image: ebpf-bench/kunai:0.6.2
          imagePullPolicy: IfNotPresent
