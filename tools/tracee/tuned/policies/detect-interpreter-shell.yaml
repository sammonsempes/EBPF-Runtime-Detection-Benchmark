apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: detect-interpreter-shell
  annotations:
    description: T1059.006 a scripting interpreter (python, perl, ruby, node, php) executes a shell
spec:
  scope:
    - container
  rules:
    - event: execve
      filters:
        - comm=python3,python,python3.12,perl,ruby,node,php
        - data.pathname=/bin/sh,/bin/bash,/bin/dash,/usr/bin/sh,/usr/bin/bash,/usr/bin/dash,sh,bash
