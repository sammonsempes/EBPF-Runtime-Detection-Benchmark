apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: detect-credentials-in-files
  annotations:
    description: T1552.001 access to files that commonly hold plaintext credentials or private keys
spec:
  scope:
    - container
  rules:
    - event: security_file_open
      filters:
        - data.pathname=*/.aws/credentials,*/.aws/config,*/.ssh/id_rsa,*/.ssh/id_ed25519,*/.ssh/id_ecdsa,*/.ssh/id_dsa,*/.kube/config,*/.docker/config.json,*/.git-credentials,*/.pgpass,*/.env
