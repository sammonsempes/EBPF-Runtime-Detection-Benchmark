cache:
    type: mem
    size: 512
buffers:
    kernel:
        events: 1024
        control-plane: 1024
healthz: true
metrics: true
pprof: false
pyroscope: false
listen-addr: :3366
log:
    level: info
enrichment:
    decoded-data: true
    user-stack: false
    environment: false
    executable-hash:
        enabled: true
        mode: dev-inode
output:
    json:
      files:
        - stdout
    sort-events: false
