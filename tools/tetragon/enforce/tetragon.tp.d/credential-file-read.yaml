apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "credential-file-read"
  annotations:
    description: "Deny and kill reads from containers of password hashes, cloud, SSH, registry and application credentials and service account tokens"
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    message: "Credential file read"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/shadow"
        - "/etc/gshadow"
      - index: 1
        operator: "Equal"
        values:
        - "4"
      matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.aws/credentials"
        - "/.aws/config"
        - "/.ssh/id_rsa"
        - "/.ssh/id_dsa"
        - "/.ssh/id_ecdsa"
        - "/.ssh/id_ed25519"
        - "/.docker/config.json"
        - "/.kube/config"
        - "/.git-credentials"
        - "/.netrc"
        - "/.pgpass"
        - "/.env"
      - index: 1
        operator: "Equal"
        values:
        - "4"
      matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/ssh"
        - "/usr/bin/ssh-add"
        - "/usr/bin/ssh-keygen"
        - "/usr/sbin/sshd"
        - "/usr/bin/git"
        - "/usr/local/bin/aws"
        - "/usr/bin/aws"
        - "/usr/bin/docker"
        - "/usr/bin/kubectl"
        - "/usr/local/bin/kubectl"
      matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/run/secrets/kubernetes.io/serviceaccount"
        - "/var/run/secrets/kubernetes.io/serviceaccount"
        - "/run/secrets/eks.amazonaws.com/serviceaccount"
        - "/var/run/secrets/eks.amazonaws.com/serviceaccount"
      - index: 1
        operator: "Equal"
        values:
        - "4"
      matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/shadow"
        - "/etc/gshadow"
      - index: 1
        operator: "Equal"
        values:
        - "4"
    tags: ["mitre.credential_access", "T1003.008", "T1552.001", "T1552.007"]
