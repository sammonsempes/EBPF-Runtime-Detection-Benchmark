apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "kernel-module-syscalls"
  annotations:
    description: "Kill init_module or finit_module calls from containers"
spec:
  kprobes:
  - call: "sys_finit_module"
    syscall: true
    message: "Kernel module load system call"
    args:
    - index: 0
      type: "int"
    selectors:
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Sigkill
    tags: ["mitre.persistence", "T1547.006"]
  - call: "sys_init_module"
    syscall: true
    message: "Kernel module load system call"
    args:
    - index: 1
      type: "uint64"
    selectors:
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Sigkill
    tags: ["mitre.persistence", "T1547.006"]
