apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "kernel-module-syscalls"
  annotations:
    description: "Deny and kill init_module or finit_module calls from containers; observe attempts that seccomp already denied through the sys_exit tracepoint"
spec:
  lists:
  - name: "module-load-syscalls"
    type: "syscalls"
    values:
    - "sys_init_module"
    - "sys_finit_module"
  kprobes:
  - call: "sys_finit_module"
    syscall: true
    message: "Kernel module load system call"
    args:
    - index: 0
      type: "int"
    selectors:
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
    tags: ["mitre.persistence", "T1547.006"]
  - call: "sys_init_module"
    syscall: true
    message: "Kernel module load system call"
    args:
    - index: 1
      type: "uint64"
    selectors:
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
    tags: ["mitre.persistence", "T1547.006"]
  tracepoints:
  - subsystem: "raw_syscalls"
    event: "sys_exit"
    message: "Kernel module load system call"
    args:
    - index: 4
      type: "uint64"
    - index: 5
      type: "int64"
    selectors:
    - matchArgs:
      - index: 0
        operator: "InMap"
        values:
        - "list:module-load-syscalls"
    tags: ["mitre.persistence", "T1547.006"]
