apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "exec-from-temp-dir"
  annotations:
    description: "Kill execution of binaries or scripts located in world-writable temporary directories inside containers"
spec:
  kprobes:
  - call: "security_bprm_check"
    syscall: false
    message: "Program executed from a temporary directory"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/var/tmp/"
        - "/dev/shm/"
      matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Sigkill
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/var/tmp/"
        - "/dev/shm/"
    tags: ["mitre.execution", "T1105", "T1036.005"]
