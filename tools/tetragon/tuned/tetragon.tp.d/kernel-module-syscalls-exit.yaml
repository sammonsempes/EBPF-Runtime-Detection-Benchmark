apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "kernel-module-syscalls-exit"
  annotations:
    description: "Observe init_module or finit_module attempts, including those that seccomp already denied, through the sys_exit tracepoint"
spec:
  lists:
  - name: "module-load-syscalls"
    type: "syscalls"
    values:
    - "sys_init_module"
    - "sys_finit_module"
  tracepoints:
  - subsystem: "raw_syscalls"
    event: "sys_exit"
    message: "Kernel module load system call"
    args:
    - index: 4
      type: "syscall64"
    - index: 5
      type: "int64"
    selectors:
    - matchArgs:
      - index: 0
        operator: "InMap"
        values:
        - "list:module-load-syscalls"
    tags: ["mitre.persistence", "T1547.006"]
